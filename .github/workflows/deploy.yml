name: Verify & Publish Industrialization Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: ${{ vars.PAUSE_DEPLOY != 'true' }}
    runs-on: ${{ fromJSON(vars.HUB_RUNNERS || '["self-hosted", "hub-agent"]') }}
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      VITEPRESS_BASE: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: npm ci --registry https://registry.npmjs.org
      - name: Gate 1 — Automated Sanitization & Confidentiality Check
        run: npm run check:sanitized
      - name: Gate 2 — Engineering Kit & Daemon Self-Tests
        run: npm run check:kits && npm run check:daemon
      - name: Gate 3 — Production VitePress Build & Link Verification
        run: npm run docs:build
      - name: Publish Static Build to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-gh-pages.mjs

